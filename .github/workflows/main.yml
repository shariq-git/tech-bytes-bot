name: Tech Bytes Automation

on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    outputs:
      post_body: ${{ steps.gen.outputs.post_body }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai requests feedparser

      - name: Generate Content
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python post_tech_bytes.py propose > draft.txt

          echo "Generated Draft:"
          cat draft.txt

          delimiter=$(openssl rand -hex 16)

          {
            echo "post_body<<$delimiter"
            cat draft.txt
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: generate
    runs-on: ubuntu-latest

    # THIS CREATES MANUAL APPROVAL
    environment:
      name: linkedin-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai requests feedparser

      - name: Show Draft Before Approval
        run: |
          echo "=================================="
          echo "${{ needs.generate.outputs.post_body }}"
          echo "=================================="

      - name: Publish to LinkedIn
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_ID: ${{ secrets.LINKEDIN_AUTHOR_ID }}
          POST_CONTENT: ${{ needs.generate.outputs.post_body }}
        run: |
          python post_tech_bytes.py post
