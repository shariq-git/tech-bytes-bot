name: Tech Bytes Daily Pipeline
on:
  schedule:
    # Runs at 04:00 UTC (9:30 AM IST) Mon, Tue, Wed, Thu, Fri, Sat
    - cron: '0 4 * * 1-6'
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  contents: read
  deployments: write 

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      post_content: ${{ steps.gen.outputs.post_body }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate Content
        id: gen
        run: |
          python post_tech_bytes.py propose > draft.txt
          echo "post_body<<EOF" >> $GITHUB_OUTPUT
          cat draft.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment: Production 
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Post to LinkedIn
        run: python post_tech_bytes.py post
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_ID: ${{ secrets.LINKEDIN_AUTHOR_ID }}
          POST_CONTENT: ${{ needs.generate.outputs.post_content }}
