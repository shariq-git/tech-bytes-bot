name: Tech Bytes Automation

on:
  schedule:
    - cron: '30 3 * * 1-5'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    outputs:
      post_body: ${{ steps.generate_post.outputs.post_body }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests feedparser

      - name: Generate LinkedIn Draft
        id: generate_post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Generate ONLY clean post content
          python post_tech_bytes.py propose > draft.txt

          echo ""
          echo "================ GENERATED LINKEDIN POST ================"
          echo ""

          cat draft.txt

          echo ""
          echo "========================================================="
          echo ""

          # Save multiline output for next job
          delimiter=$(openssl rand -hex 16)

          {
            echo "post_body<<$delimiter"
            cat draft.txt
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: generate

    runs-on: ubuntu-latest

    # Manual approval required before publishing
    environment:
      name: Production

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests feedparser

      - name: Show Approved Content
        run: |
          echo ""
          echo "============= APPROVED LINKEDIN POST ============="
          echo ""
          echo "${{ needs.generate.outputs.post_body }}"
          echo ""
          echo "=================================================="

      - name: Publish to LinkedIn
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_ID: ${{ secrets.LINKEDIN_AUTHOR_ID }}
          POST_CONTENT: ${{ needs.generate.outputs.post_body }}
        run: |
          echo "Publishing approved content to LinkedIn..."

          python post_tech_bytes.py post

          echo "Post published successfully."
