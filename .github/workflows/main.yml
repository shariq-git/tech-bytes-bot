name: Tech Bytes with Approval
on:
  schedule:
    - cron: '30 3 * * 1,3,5' # 9:00 AM IST
  issue_comment:
    types: [created]
  workflow_dispatch:
# ADD THIS SECTION HERE
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  propose-or-regenerate:
    # Runs on schedule, manual trigger, OR when you comment /regenerate
    if: |
      github.event_name == 'schedule' || 
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/regenerate'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install google-genai requests

      - name: Generate Content
        id: gen
        run: |
          # Redirecting output to a physical file for the issue creator to read
          python post_tech_bytes.py propose > post_body
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Approval Issue
        uses: peter-evans/create-issue-from-file@v5
        if: github.event_name != 'issue_comment'
        with:
          title: "🚀 Review Tech Byte Draft"
          content-filepath: ./post_body
          labels: "approval-required"

      - name: Reply to Regenerate
        if: github.event_name == 'issue_comment'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🔄 New Draft Generated:
            $(cat post_body)
            
            ---
            Reply with `/approve` to post this, or `/regenerate` again.

  publish:
    # Only runs when you comment /approve
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - run: pip install requests
      
      - name: Post to LinkedIn
        run: python post_tech_bytes.py post
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_ID: ${{ secrets.LINKEDIN_AUTHOR_ID }}
          # Captures the text from the issue description/body
          POST_CONTENT: ${{ github.event.issue.body }}
      
      - name: Close Issue on Success
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "✅ Successfully posted to LinkedIn!"
