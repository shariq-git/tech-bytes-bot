name: Tech Bytes Automation

on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    outputs:
      post_body: ${{ steps.gen.outputs.post_body }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests feedparser

      - name: Generate LinkedIn Draft
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          # Generate ONLY post content into file
          python post_tech_bytes.py propose > draft.txt

          echo "================ GENERATED POST ================"
          cat draft.txt
          echo "================================================"

          # Multiline GitHub Actions output
          delimiter=$(openssl rand -hex 16)

          {
            echo "post_body<<$delimiter"
            cat draft.txt
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Draft Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-draft
          path: draft.txt

  publish:
    needs: generate
    runs-on: ubuntu-latest

    # MANUAL APPROVAL REQUIRED
    environment:
      name: Production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests feedparser

      - name: Preview Approved Content
        run: |
          echo "================ FINAL POST ================"
          echo "${{ needs.generate.outputs.post_body }}"
          echo "============================================"

      - name: Publish to LinkedIn
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_ID: ${{ secrets.LINKEDIN_AUTHOR_ID }}
          POST_CONTENT: ${{ needs.generate.outputs.post_body }}
        run: |
          set -e
          python post_tech_bytes.py post
