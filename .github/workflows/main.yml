name: Tech Bytes with Approval Gate
on:
  push:
    branches:
      - main
  workflow_dispatch: # This allows you to trigger it manually to test the prompt

permissions:
  contents: read
  deployments: write # Required to trigger the environment gate

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      post_content: ${{ steps.gen.outputs.post_body }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - run: pip install google-genai requests

      - name: Generate Content
        id: gen
        run: |
          # Generate the content and show it in the logs for review
          python post_tech_bytes.py propose > draft.txt
          echo "=========================================="
          echo "🚀 PREVIEW OF TODAY'S POST:"
          echo "=========================================="
          cat draft.txt
          echo "=========================================="
          
          # Save to output variable for the next job
          echo "post_body<<EOF" >> $GITHUB_OUTPUT
          cat draft.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  publish:
    needs: generate
    runs-on: ubuntu-latest
    # CRITICAL: This name must match exactly what you named your Environment in Settings
    environment: Production 
    steps:
      - uses: actions/checkout@v4
      - name: Post to LinkedIn
        run: python post_tech_bytes.py post
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_ID: ${{ secrets.LINKEDIN_AUTHOR_ID }}
          POST_CONTENT: ${{ needs.generate.outputs.post_content }}
