name: Tech Bytes Automation

on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      post_body: ${{ steps.gen.outputs.post_body }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install google-genai requests feedparser

      - name: Generate Content
        id: gen
        run: |
          # Run the script and capture to a file
          python post_tech_bytes.py propose > draft.txt
          
          # Use a delimiter that is unlikely to be in the post text
          delimiter=$(openssl rand -hex 16)
          echo "post_body<<$delimiter" >> $GITHUB_OUTPUT
          cat draft.txt >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  publish:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install google-genai requests feedparser

      - name: Post to LinkedIn
        run: python post_tech_bytes.py post
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_ID: ${{ secrets.LINKEDIN_AUTHOR_ID }}
          # Use the output passed from the generate job
          POST_CONTENT: ${{ needs.generate.outputs.post_body }}
