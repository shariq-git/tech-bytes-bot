name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows you to start it manually for testing

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python # Updated from Node.js to match your DevOps/SRE projects
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai requests
          # If you have a requirements.txt, use: pip install -r requirements.txt

      - name: Run Script
        run: python post_tech_bytes.py propose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Add keyword
        run: echo 'Adding keyword'
