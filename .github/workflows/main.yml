name: Tech Bytes with Approval Gate
on:
  schedule:
    - cron: '30 3 * * 1,3,5' # 9:00 AM IST
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      post_content: ${{ steps.gen.outputs.post_body }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install google-genai
      - name: Generate Content
        id: gen
        run: |
          # The 'propose' mode in your script handles the K8s/AWS/Azure rotation
          CONTENT=$(python post_tech_bytes.py propose)
          echo "post_body<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  publish:
    needs: generate
    runs-on: ubuntu-latest
    # This must match the environment name you created in the UI
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Post to LinkedIn
        run: |
          # Use the output from the 'generate' job
          python post_tech_bytes.py post
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_ID: ${{ secrets.LINKEDIN_AUTHOR_ID }}
          POST_CONTENT: ${{ needs.generate.outputs.post_content }}
